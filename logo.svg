<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- GTEC Emblem / Badge -->
  <rect x="6" y="10" width="60" height="60" rx="16" fill="url(#blue-grad)" />
  <circle cx="36" cy="40" r="22" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="85 25" />
  <path d="M36 26 C43.7 26 50 32.3 50 40 L36 40" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round" />
  <text x="36" y="47" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">G</text>
  
  <!-- G-TEC Brand Typography -->
  <text x="80" y="42" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="-0.5">
    G-TEC<tspan fill="#2563EB">.</tspan>
  </text>
  <!-- Ottapalam Centre Tag -->
  <rect x="80" y="50" width="85" height="18" rx="4" fill="#EFF6FF" />
  <text x="86" y="63" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="10.5" fill="#1D4ED8" letter-spacing="1.2">OTTAPALAM</text>
  <text x="175" y="63" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="10" fill="#64748B">CENTRE OF EXCELLENCE</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="blue-grad" x1="6" y1="10" x2="66" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
</svg>
